name: iOS TestFlight

# Push a tag like ios-v0.10.0 to build, sign and upload the iPhone app to TestFlight.
# The tag sets the version (0.10.0); the run number sets the build number.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID        Apple developer Team ID
#   ASC_KEY_ID           App Store Connect API key ID (Admin role, for automatic signing)
#   ASC_ISSUER_ID        App Store Connect issuer ID
#   ASC_KEY_P8_BASE64    the key's AuthKey_<id>.p8 file, base64-encoded
#   SIGNING_CERT_P12_BASE64  one Apple Development certificate with its private key (.p12), base64-encoded
#   SIGNING_CERT_PASSWORD    the password the .p12 was exported with
# The saved certificate signs every archive. Without it Xcode made a new development certificate
# on each run (the runner starts empty) until the account hit Apple's limit.
# and this repository variable:
#   PASSKEY_DOMAIN       your ByteSize server's host name, for passkey sign-in
on:
  push:
    tags: ["ios-v*"]
  # Or by hand (Actions › iOS TestFlight › Run workflow): the version to ship, e.g. 0.13.0, from the chosen branch
  workflow_dispatch:
    inputs:
      version:
        description: "Version to upload, e.g. 0.13.0"
        required: true

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: xcode-27
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PASSKEY_DOMAIN: ${{ vars.PASSKEY_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode 27
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version

      - name: Work out the version and build number
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          bash ios/scripts/ci-version.test.sh
          TAG="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="ios-v$INPUT_VERSION"; fi
          echo "APP_VERSION=$(bash ios/scripts/ci-version.sh "$TAG")" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Check the secrets are set
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID PASSKEY_DOMAIN; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; exit 1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8_BASE64 }}" ]; then echo "::error::ASC_KEY_P8_BASE64 is not set"; exit 1; fi
          if [ -z "${{ secrets.SIGNING_CERT_P12_BASE64 }}" ]; then echo "::error::SIGNING_CERT_P12_BASE64 is not set"; exit 1; fi

      - name: Put the saved signing certificate in a keychain
        env:
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "${{ secrets.SIGNING_CERT_P12_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Development" \
            || { echo "::error::SIGNING_CERT_P12_BASE64 holds no Apple Development certificate"; exit 1; }

      - name: Put the API key and signing settings in place
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
          printf 'DEVELOPMENT_TEAM = %s\nCODE_SIGN_STYLE = Automatic\nPASSKEY_DOMAIN = %s\n' \
            "$APPLE_TEAM_ID" "$PASSKEY_DOMAIN" > ios/Local.xcconfig
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Install XcodeGen and make the project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (signed with the saved certificate; profiles fetched with the API key)
        working-directory: ios
        run: |
          xcodebuild archive -project ByteSize.xcodeproj -scheme ByteSize -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ByteSize.xcarchive" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ByteSize.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded ByteSize $APP_VERSION ($BUILD_NUMBER) to App Store Connect. It shows in TestFlight after Apple finishes processing (usually 5-30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key and the signing keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys" ios/Local.xcconfig
          [ -n "$SIGNING_KEYCHAIN" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
