# XcodeGen spec for the ByteSize iPhone app. Generate the project with `xcodegen generate` (the .xcodeproj is
# not committed). Put your Apple team id in Local.xcconfig (see Local.xcconfig.example) to run on a device.
name: ByteSize
options:
  bundleIdPrefix: com.cwland
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  ByteSizeKit:
    path: ByteSizeKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ByteSize:
    type: application
    platform: iOS
    sources: [ByteSize]
    dependencies:
      - package: ByteSizeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cwland.bytesize
        PRODUCT_NAME: ByteSize
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ByteSize
        INFOPLIST_KEY_NSCameraUsageDescription: ByteSize uses the camera to scan barcodes and photograph food and nutrition labels.
        INFOPLIST_KEY_NSHealthShareUsageDescription: ByteSize reads your weight, steps and workouts from Apple Health.
        # Apple requires this one too for any HealthKit app, even one that only reads (TestFlight upload refused without it)
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: ByteSize only reads from Apple Health; it doesn't save anything there.
        CODE_SIGN_ENTITLEMENTS: ByteSize/ByteSize.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ByteSize/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.cwland.bytesize
            CFBundleURLSchemes: [bytesize]
  ByteSizeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ByteSizeTests]
    dependencies:
      - target: ByteSize
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ByteSizeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ByteSizeUITests]
    dependencies:
      - target: ByteSize
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ByteSize
schemes:
  ByteSize:
    build:
      targets:
        ByteSize: all
    test:
      targets: [ByteSizeTests, ByteSizeUITests]
